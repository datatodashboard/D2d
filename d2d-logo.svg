<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="85%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Metallic Gold Gradient for Orbit & 2 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Arc Gold to White Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Silver/Platinum Gradient for D letters -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Bar Chart Gold Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gold Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Black Circular Background -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGrad)"/>

  <!-- Orbital Ring (Upper Gold, Lower Silver-White) -->
  <!-- Top/Right Arc (Gold) -->
  <path d="M 105,185 A 165,165 0 0,1 405,305" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- Bottom/Left Arc (Silver to White) -->
  <path d="M 405,305 A 165,165 0 0,1 95,200" fill="none" stroke="url(#arcGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Orbital Planet Dots -->
  <!-- Left Orbit Dot -->
  <circle cx="105" cy="185" r="7.5" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <!-- Right Orbit Dot -->
  <circle cx="395" cy="310" r="7.5" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- CENTRAL "D2D" LOGO MARK -->
  <g transform="translate(0, 0)">
    
    <!-- FIRST "D" (Silver with inner Bar Chart) -->
    <!-- Outer D shape: Stem + Curved Right Side -->
    <path d="M 124,180 L 174,180 C 205,180 220,198 220,238 C 220,278 205,296 174,296 L 124,296 Z 
             M 148,204 L 148,272 L 168,272 C 188,272 196,262 196,238 C 196,214 188,204 168,204 Z" 
          fill="url(#silverGrad)"/>

    <!-- 3 Ascending Bar Chart Bars inside the first D's bowl -->
    <g transform="translate(147, 212)">
      <!-- Bar 1 (Short) -->
      <rect x="0" y="38" width="8" height="22" rx="1.5" fill="url(#chartGrad)"/>
      <!-- Bar 2 (Medium) -->
      <rect x="13" y="24" width="8" height="36" rx="1.5" fill="url(#chartGrad)"/>
      <!-- Bar 3 (Tall) -->
      <rect x="26" y="8" width="8" height="52" rx="1.5" fill="url(#chartGrad)"/>
    </g>

    <!-- SECOND "D" (Silver on the Right) -->
    <path d="M 294,180 L 344,180 C 375,180 390,198 390,238 C 390,278 375,296 344,296 L 294,296 Z 
             M 318,204 L 318,272 L 338,272 C 358,272 366,262 366,238 C 366,214 358,204 338,204 Z" 
          fill="url(#silverGrad)"/>

    <!-- CENTER "2" (Gold Overlapping) -->
    <!-- Stylized geometric gold 2 -->
    <path d="M 212,208 C 212,190 226,178 250,178 C 274,178 288,190 288,207 C 288,223 277,236 261,250 L 235,272 L 289,272 L 289,296 L 214,296 L 214,275 L 249,242 C 260,231 266,223 266,211 C 266,202 259,197 249,197 C 238,197 232,203 232,212 Z" 
          fill="url(#goldGrad)" 
          filter="url(#goldGlow)"/>

  </g>

  <!-- "DATA TO DASHBOARD" Subtitle -->
  <text x="250" y="340" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        font-weight="800" 
        letter-spacing="5.5" 
        fill="#ffffff" 
        text-anchor="middle">DATA TO DASHBOARD</text>

  <!-- Thin Gold Divider Line with Center Dot -->
  <line x1="170" y1="358" x2="238" y2="358" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="250" cy="358" r="3.5" fill="url(#goldGrad)"/>
  <line x1="262" y1="358" x2="330" y2="358" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

</svg>
